# Hooks into a Traefik instance that's already running (yours or another project's).
# The entrypoint name (websecure) and resolver name (letsencrypt) need to match
# whatever that Traefik setup uses.
services:
  portfolio:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-web}"
      - "traefik.http.routers.portfolio.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
