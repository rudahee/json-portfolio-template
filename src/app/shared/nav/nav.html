<header class="nav">
  <div class="nav__bar wrap">
    <a class="nav__brand" routerLink="/">{{ site()?.name }}</a>

    <button
      class="nav__toggle"
      type="button"
      aria-controls="main-menu"
      [attr.aria-expanded]="open()"
      (click)="open.set(!open())">
      {{ open() ? 'Close' : 'Menu' }}
    </button>

    <nav id="main-menu" class="nav__menu" [class.is-open]="open()" aria-label="Main">
      <ul role="list">
        @for (link of links(); track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
