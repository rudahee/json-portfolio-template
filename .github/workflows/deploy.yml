name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project sites (username.github.io/repo-name/) need a base-href
      # matching the subpath; user/org sites (username.github.io) use "/".
      - name: Compute base href
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npx ng build --base-href "${{ steps.base.outputs.href }}"

      # SPA fallback: GitHub Pages has no server-side rewrites, so unknown
      # paths (deep links, refreshes) are served the app shell via 404.html.
      - name: Prepare Pages output
        run: |
          cp dist/portfolio-web/browser/index.html dist/portfolio-web/browser/404.html
          touch dist/portfolio-web/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
