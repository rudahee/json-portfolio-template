server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Nginx no hereda add_header dentro de location, por eso se incluye en cada bloque.
    include /etc/nginx/snippets/security-headers.conf;

    # JS, CSS y fuentes llevan hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Los JSON de contenido se revisan siempre (cambiar un texto se ve al momento).
    location /assets/data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Obras: una semana. Si sustituyes una imagen, mejor cambiarle el nombre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta (/ilustracion/mi-obra) la resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
